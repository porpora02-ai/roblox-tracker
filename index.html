<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LunarX</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="cursorGlow"></div>

<div class="topbar">
    <div class="logo">🌙 LunarX</div>
</div>

<!-- GAME LIST -->
<div id="gameListPage">

    <div class="main">

        <h1>Available Games</h1>

        <input id="search" placeholder="Search games...">

        <div id="gamesContainer"></div>

    </div>

</div>

<!-- EXECUTOR -->
<div id="gameExecPage" style="display:none">

    <div class="main">

        <button class="join" onclick="goBack()">⬅ Back</button>

        <h1 id="selectedGameTitle">Game</h1>

        <div class="executor">

            <div class="leftPanel">
                <h2>Players</h2>
                <div id="playerList"></div>
            </div>

            <div class="rightPanel">

                <h2>Commands</h2>

                <button class="cmdBtn" onclick="selectCommand('R6')">
                    🔄 Force R6
                </button>

                <p id="selectedPlayer">Selected Player: none</p>
                <p id="selectedCommand">Selected Command: none</p>

                <button class="join" onclick="executeCommand()">
                    EXECUTE
                </button>

            </div>

        </div>

    </div>

</div>

<script src="/app.js"></script>

</body>
</html>
